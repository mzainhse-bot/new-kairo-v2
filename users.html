<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المستخدمين - RMED</title>
<style>*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial}body{margin:0;background:#F4F6F9;color:#0A1F44}header{background:#0A1F44;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.container{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}table{width:100%;border-collapse:collapse;font-size:13px}table th{background:#0A1F44;color:#fff;padding:9px}table td{padding:9px;border-bottom:1px solid #ECEFF1;text-align:center}select{padding:8px;border-radius:8px}.btn2{background:#ECEFF1;border:1px solid #CFD8DC;padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px}.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}.kpi{background:#fff;border-radius:12px;padding:14px;text-align:center;border-bottom:3px solid #0A1F44}.kpi b{font-size:20px;display:block}.badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold}.badge.pending{background:#FFF3E0;color:#E65100}.badge.approved{background:#E8F5E9;color:#2E7D32}.badge.manager{background:#E3F2FD;color:#1565C0}</style>
</head>
<body>
<header><h2 style="margin:0;">👑 إدارة المستخدمين - للمدير فقط</h2><a href="dashboard.html" style="background:#fff;color:#0A1F44;text-decoration:none;padding:8px 14px;border-radius:20px;font-weight:bold;font-size:13px;">🏠 لوحة التحكم</a></header>
<div class="container" id="main"></div>
<script>
let me=JSON.parse(localStorage.getItem('safetyUser')||'null');
if(!me||me.role!=='manager'){ document.body.innerHTML='<div style="text-align:center;padding:60px;"><h1>⛔</h1><p>الصفحة دي للمدير بس</p><a href="login.html">ارجع للدخول</a></div>'; throw new Error('not manager'); }
let DB=JSON.parse(localStorage.getItem('safetyDB')||'{}'); if(!DB.users) DB.users=[];
function save(){ localStorage.setItem('safetyDB',JSON.stringify(DB)); render(); }
function render(){
  let users=DB.users;
  let pending=users.filter(u=>u.status==='pending').length, approved=users.filter(u=>u.status==='approved').length, mgr=users.filter(u=>u.role==='manager').length, sup=users.filter(u=>u.role==='supervisor').length;
  document.getElementById('main').innerHTML=`
  <div class="kpi-grid"><div class="kpi"><b>${users.length}</b><small>إجمالي المستخدمين</small></div><div class="kpi"><b>${pending}</b><small>في انتظار الموافقة</small></div><div class="kpi"><b>${approved}</b><small>مقبولين</small></div><div class="kpi"><b>${mgr} مدير / ${sup} مشرف</b><small>الأدوار العليا</small></div></div>
  <div class="card"><h3>⏳ طلبات التسجيل الجديدة - مستنية موافقتك</h3>${users.filter(u=>u.status==='pending').length? '<table><tr><th>الصورة</th><th>الاسم</th><th>المهنة</th><th>الإيميل</th><th>اختار الدور</th><th>موافقة</th><th>رفض</th></tr>'+users.map((u,i)=>u.status==='pending'? `<tr><td><img src="${u.photo||''}" style="width:40px;height:50px;object-fit:cover;border-radius:8px;" onerror="this.style.display='none'"></td><td><b>${u.name}</b></td><td>${u.job}</td><td>${u.email}</td><td><select id="role-${i}"><option value="visitor">زائر - مشاهدة فقط</option><option value="employee" selected>موظف - رفع تقارير</option><option value="supervisor">مشرف - كل التعديلات</option></select></td><td><button class="btn2" style="background:#2E7D32;color:#fff;" onclick="approve(${i})">✅ قبول</button></td><td><button class="btn2" style="color:#D32F2F;" onclick="reject(${i})">❌ رفض</button></td></tr>`:'').join('')+'</table>':'<p style="color:#2E7D32;">✅ مفيش طلبات جديدة</p>'}</div>
  <div class="card"><h3>👥 كل المستخدمين</h3><table><tr><th>الصورة</th><th>الاسم</th><th>المهنة</th><th>الإيميل</th><th>الدور</th><th>الحالة</th><th>تغيير الدور</th><th>حذف الحساب</th></tr>${users.map((u,i)=>`<tr><td><img src="${u.photo||''}" style="width:40px;height:50px;object-fit:cover;border-radius:8px;" onerror="this.style.display='none'"></td><td><b>${u.name}</b></td><td>${u.job}</td><td>${u.email}</td><td><span class="badge ${u.role==='manager'?'manager':'approved'}">${u.role==='manager'?'مدير':u.role==='supervisor'?'مشرف':u.role==='employee'?'موظف':u.role==='visitor'?'زائر':'معلق'}</span></td><td>${u.status==='approved'?'✅ مقبول':'⏳ معلق'}</td><td>${u.role==='manager'? 'مدير - ثابت':'<select onchange="changeRole('+i+',this.value)"><option value="visitor" ${u.role==='visitor'?'selected':''}>زائر</option><option value="employee" ${u.role==='employee'?'selected':''}>موظف</option><option value="supervisor" ${u.role==='supervisor'?'selected':''}>مشرف</option></select>'}</td><td>${u.role==='manager'? '-':'<button class="btn2" style="color:#D32F2F;" onclick="delUser('+i+')">🗑️ حذف الحساب</button>'}</td></tr>`).join('')+'</table><p style="color:#78909C;font-size:12px;">⚠️ لما تحذف حساب حد ساب المشروع، حسابه بيتمسح خالص، بس كل التقارير والبيانات اللي عملها بتفضل موجودة لأنها خاصة بالمشروع.</p></div>`;
}
function approve(i){ let role=document.getElementById('role-'+i).value; DB.users[i].role=role; DB.users[i].status='approved'; save(); let u=DB.users[i]; let s=encodeURIComponent('تم قبول حسابك في RMED'); let b=encodeURIComponent('أهلاً '+u.name+'،\nتم قبول حسابك في موقع RMED.\nدورك: '+role+'\nادخل من هنا وابدأ شغلك.'); window.open('mailto:'+u.email+'?subject='+s+'&body='+b,'_blank'); alert('✅ تم قبول '+u.name+' كـ '+role); }
function reject(i){ if(!confirm('ترفض '+DB.users[i].name+'؟ حسابه هيتمسح')) return; let u=DB.users[i]; DB.users.splice(i,1); save(); window.open('mailto:'+u.email+'?subject='+encodeURIComponent('تم رفض حسابك في RMED')+'&body='+encodeURIComponent('عذراً '+u.name+'، تم رفض طلب تسجيلك.'),'_blank'); }
function changeRole(i,role){ DB.users[i].role=role; save(); alert('تم تغيير الدور لـ '+DB.users[i].name); }
function delUser(i){ let u=DB.users[i]; if(!confirm('تحذف حساب '+u.name+'؟\nحسابه هيتمسح خالص، بس تقاريره هتفضل موجودة.')) return; DB.users.splice(i,1); save(); let s=encodeURIComponent('تم إيقاف حسابك في RMED'); let b=encodeURIComponent('أهلاً '+u.name+'،\nتم إيقاف حسابك في موقع RMED.\nلو رجعت المشروع تاني، سجل حساب جديد والمدير هيوافق عليه.'); window.open('mailto:'+u.email+'?subject='+s+'&body='+b,'_blank'); alert('تم حذف حساب '+u.name); }
render();
</script></body></html>
