<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Count V4 - RMED</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial}
body{margin:0;background:#F6F7F9;color:#111}
.sidebar{position:fixed;top:0;right:0;width:280px;height:100vh;background:#0F2A4D;color:#fff;padding:16px 14px;display:flex;flex-direction:column}
html[dir="ltr"] .sidebar{right:auto;left:0}
.sidebar a{display:flex;gap:12px;color:#CBD5E1;text-decoration:none;padding:11px 12px;border-radius:12px;font-size:13px;font-weight:600}
.sidebar a.active{background:#FF6B00;color:#fff;font-weight:900}
.main{margin-right:280px}.hazard{height:8px;background:repeating-linear-gradient(45deg,#FFD700 0 16px,#111 16px 32px)}
html[dir="ltr"] .main{margin-right:0;margin-left:280px}
.topbar{display:flex;gap:12px;padding:14px 20px;background:#fff;border-bottom:3px solid #111;position:sticky;top:0;z-index:90}
.btn-orange{background:#FF6B00;color:#fff;border:none;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}
.btn-ghost{background:#fff;border:1px solid #ddd;padding:8px 14px;border-radius:99px;cursor:pointer;font-weight:700}
.btn-ghost.active{background:#111;color:#fff}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.kpi{background:#fff;border:1px solid #eee;border-radius:16px;padding:16px}
.kpi b{font-size:26px;display:block}.kpi small{color:#666}
.panel{background:#fff;border:1px solid #eee;border-radius:18px;padding:18px;margin-bottom:14px}
input,select{width:100%;padding:11px;border:1.5px solid #ddd;border-radius:12px}
label{display:block;font-size:12px;font-weight:800;margin:11px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-size:12px}table th{background:#0F2A4D;color:#fff;padding:11px}table td{padding:10px;border-bottom:1px solid #eee;text-align:center}
.total-box{background:#FFF8E1;border-radius:14px;padding:14px;text-align:center;margin-top:12px}
.notif-panel{position:fixed;top:60px;left:20px;width:360px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:200;display:none;padding:14px}.notif-panel.show{display:block}
@media(max-width:900px){.sidebar{display:none}.main{margin:0}.kpi-row{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hazard"></div>
<aside class="sidebar">
<div style="text-align:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)"><b style="font-size:32px">RMED</b></div>
<a href="index.html">🏠 <span data-i18n="home">Home</span></a>
<a href="dashboard.html">📊 Dashboard</a>
<a href="induction.html">📋 Induction</a>
<a href="accidents.html">🚑 Accidents</a>
<a href="daily-count.html" class="active">🔢 <span data-i18n="daily">Daily Count</span></a>
<a href="ncr.html">📄 NCR</a>
<a href="violations.html">⚠️ Violations</a>
</aside>
<div class="main">
<div class="topbar"><b data-i18n="title">عدد عمال اليوم • Daily Count</b><div style="margin-inline-start:auto;display:flex;gap:8px">
<button class="btn-ghost" onclick="toggleNotif()">🔔 <span id="notifCount" style="background:#E53935;color:#fff;border-radius:50%;padding:2px 7px;display:none">0</span></button>
<button class="btn-ghost" id="btnAr" onclick="setLang('ar')">عربي</button>
<button class="btn-ghost" id="btnEn" onclick="setLang('en')">EN</button></div></div>
<div id="notifPanel" class="notif-panel"><b>الإشعارات</b><div id="notifList"></div></div>
<div style="padding:16px 20px">
<div class="panel" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
<div style="flex:1"><label>📅 اليوم</label><input type="date" id="filterDate" onchange="loadDaily()"></div>
<div style="flex:1"><label>🏢 الشركة</label><select id="filterCompany" onchange="renderDaily()"><option value="">كل الشركات</option></select></div>
<button class="btn-orange" onclick="loadDaily()">🔄 تحديث</button>
</div>

<div class="kpi-row">
<div class="kpi"><b id="k-total-day">0</b><small data-i18n="total">إجمالي عمال اليوم</small></div>
<div class="kpi"><b id="k-safety-day">0</b><small>قسم السلامة</small></div>
<div class="kpi"><b id="k-companies">0</b><small>عدد الشركات</small></div>
<div class="kpi"><b id="k-max" style="font-size:16px">-</b><small>الأعلى</small></div>
</div>

<div class="panel"><h2>🏢 إجمالي كل شركة</h2><div id="companyTotals"></div></div>

<div class="panel">
<h2 data-i18n="add">تسجيل عدد يومي جديد</h2>
<div class="grid2"><div><label>Company *</label><input id="d-company" list="compList" placeholder="RMED..."><datalist id="compList"></datalist></div>
<div><label>Date *</label><input type="date" id="d-date"></div></div>
<div class="grid2"><div><label>Safety *</label><input type="number" min="0" id="d-safety" oninput="calcLive()"></div>
<div><label>Total Company *</label><input type="number" min="0" id="d-total" oninput="calcLive()"></div></div>
<div class="total-box">Safety: <b id="liveSafety">0</b> / Total: <b id="liveTotal">0</b><br><small id="liveDetail"></small></div>
<button class="btn-orange" style="width:100%;margin-top:12px" onclick="addDaily()">💾 Save Daily Count</button>
</div>

<div class="panel"><h2>سجلات اليوم</h2><input id="searchD" placeholder="🔍 Search..." oninput="renderDaily()" style="margin-bottom:10px"><div id="dailyTable"></div>
<button class="btn-ghost" onclick="exportDaily()" style="margin-top:10px">📥 Export Excel</button></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const I18N={ar:{home:"الرئيسية",daily:"عدد عمال اليوم",title:"عدد عمال اليوم",total:"إجمالي عمال اليوم",add:"تسجيل عدد يومي جديد"},en:{home:"Home",daily:"Daily Count",title:"Daily Count",total:"Total Workers Today",add:"Add Daily Count"}};
function setLang(l){localStorage.setItem('lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(el=>{let k=el.dataset.i18n;if(I18N[l][k])el.textContent=I18N[l][k]});document.getElementById('btnAr').classList.toggle('active',l==='ar');document.getElementById('btnEn').classList.toggle('active',l==='en')}
setLang(localStorage.getItem('lang')||'ar');
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toggleNotif(){document.getElementById('notifPanel').classList.toggle('show')}
let dailyCount=[];
function makeId(company,date){return company.trim().toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]+/g,'_')+'_'+date}
async function loadDaily(){
 let date=document.getElementById('filterDate').value;
 try{
  // FIX: Query by date only, one collection, no 3 collections merge
  let snap=await firebase.firestore().collection('dailyCount').where('date','==',date).get();
  dailyCount=snap.docs.map(d=>({id:d.id,...d.data()}));
 }catch(e){ console.log(e); dailyCount=[]; }
 renderDaily(); loadNotif();
}
function renderDaily(){
 let comp=document.getElementById('filterCompany').value, q=(document.getElementById('searchD').value||'').toLowerCase();
 let comps=[...new Set(dailyCount.map(x=>x.company))];
 document.getElementById('filterCompany').innerHTML='<option value="">كل الشركات</option>'+comps.map(c=>`<option ${c===comp?'selected':''}>${escapeHtml(c)}</option>`).join('');
 document.getElementById('compList').innerHTML=comps.map(c=>`<option value="${escapeHtml(c)}">`).join('');
 let list=dailyCount.filter(x=>(!comp||x.company===comp)&&(x.company||'').toLowerCase().includes(q));
 let total=list.reduce((s,x)=>s+(Number(x.total)||0),0);
 let safety=list.reduce((s,x)=>s+(Number(x.safety)||0),0);
 document.getElementById('k-total-day').textContent=total;
 document.getElementById('k-safety-day').textContent=safety;
 document.getElementById('k-companies').textContent=new Set(list.map(x=>x.company)).size;
 let maxRec=[...list].sort((a,b)=>b.total-a.total)[0];
 document.getElementById('k-max').textContent=maxRec?maxRec.total+' - '+maxRec.company:'-';
 let maxT=Math.max(...list.map(x=>x.total),1);
 document.getElementById('companyTotals').innerHTML=list.map(x=>`<div style="display:flex;justify-content:space-between;font-size:13px"><span>🏢 ${escapeHtml(x.company)} - Safety: ${x.safety||0}</span><b>${x.total} workers</b></div><div style="height:10px;background:#eee;border-radius:10px;margin:6px 0"><div style="height:100%;background:#FF6B00;width:${(x.total/maxT*100).toFixed(0)}%;border-radius:10px"></div></div>`).join('')||'لا توجد بيانات لليوم ده';
 document.getElementById('dailyTable').innerHTML=list.length?`<table><tr><th>Date</th><th>Company</th><th>Safety</th><th>Total</th><th>Action</th></tr>${list.map(x=>`<tr><td>${escapeHtml(x.date)}</td><td>${escapeHtml(x.company)}</td><td>${x.safety||0}</td><td><b>${x.total}</b></td><td><button class="btn-ghost" onclick="delDaily('${x.id}')">🗑️</button></td></tr>`).join('')}</table>`:'<p>لا توجد سجلات</p>';
}
function calcLive(){let s=parseInt(document.getElementById('d-safety').value)||0;let t=parseInt(document.getElementById('d-total').value)||0;document.getElementById('liveSafety').textContent=s;document.getElementById('liveTotal').textContent=t;document.getElementById('liveDetail').textContent=s>t?'⚠️ السلامة أكبر من الإجمالي - غلط':t>0?`Safety ${s} / ${t}`:''}
async function addDaily(){
 let company=document.getElementById('d-company').value.trim(),date=document.getElementById('d-date').value,safety=parseInt(document.getElementById('d-safety').value)||0,total=parseInt(document.getElementById('d-total').value)||0;
 if(!company||!date) return alert('املأ الشركة والتاريخ');
 if(total===0) return alert('اكتب الإجمالي');
 if(safety>total) return alert('السلامة مينفعش تبقى أكبر من الإجمالي');
 let id=makeId(company,date);
 let exists=dailyCount.find(x=>x.id===id);
 if(exists && !confirm('موجود بالفعل - تحدثه؟')) return;
 await firebase.firestore().collection('dailyCount').doc(id).set({company,date,safety,total,counts:{'Safety Department':safety},updatedAt:new Date().toISOString(),createdAt:exists?exists.createdAt:new Date().toISOString()},{merge:true});
 alert('✅ تم الحفظ'); loadDaily();
}
async function delDaily(id){if(!confirm('حذف؟'))return; await firebase.firestore().collection('dailyCount').doc(id).delete(); loadDaily();}
async function loadNotif(){
 let notifs=[];
 try{
  let a=await firebase.firestore().collection('accidents').orderBy('createdAt','desc').limit(3).get();
  a.forEach(d=>{let x=d.data(); notifs.push(`🚑 حادث: ${x.company||''}`)});
 }catch(e){}
 let c=document.getElementById('notifCount'); c.style.display=notifs.length?'inline-block':'none'; c.textContent=notifs.length;
 document.getElementById('notifList').innerHTML=notifs.map(n=>`<div style="padding:8px;border-bottom:1px solid #eee">${escapeHtml(n)}</div>`).join('')||'لا توجد إشعارات';
}
function exportDaily(){
 let csv='Company,Date,Safety,Total\n'+dailyCount.map(x=>[x.company,x.date,x.safety,x.total].join(',')).join('\n');
 let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'})); a.download='daily-'+document.getElementById('filterDate').value+'.csv'; a.click();
}
let today=new Date().toISOString().slice(0,10);
document.getElementById('d-date').value=today; document.getElementById('filterDate').value=today;
loadDaily();
</script>
</body></html>
