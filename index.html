<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NK- HSE Portal | New Kairo Project</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{margin:0;min-height:100vh;background:#000;color:#fff;overflow-x:hidden;position:relative}
body:before{content:"";position:fixed;inset:0;background:
radial-gradient(circle at 20% 10%,rgba(212,175,55,.35) 0%,transparent 40%),
radial-gradient(circle at 85% 90%,rgba(212,175,55,.25) 0%,transparent 40%),
linear-gradient(135deg,#0a0f1e 0%,#000 50%,#1a1400 100%);z-index:0}
body:after{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px;z-index:0}
.wrap{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 15px;flex-direction:column}
.top-badge{background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.5);color:#f5d76e;padding:6px 18px;border-radius:30px;font-size:12px;letter-spacing:2px;margin-bottom:16px;backdrop-filter:blur(10px)}
.card{width:100%;max-width:460px;background:rgba(255,255,255,.08);border:1px solid rgba(212,175,55,.45);border-radius:26px;padding:30px 26px;text-align:center;backdrop-filter:blur(18px);box-shadow:0 25px 70px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.25);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,#f5d76e,transparent)}
.logo{width:84px;height:84px;margin:0 auto 12px;background:linear-gradient(135deg,#fff8d6,#f5d76e,#d4af37,#8a6d00);color:#000;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;box-shadow:0 10px 30px rgba(212,175,55,.5);transform:rotate(-3deg)}
h1{margin:5px 0 2px;font-size:28px;letter-spacing:1px;background:linear-gradient(90deg,#fff,#f5d76e,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.proj{margin:0 0 6px;color:#ddd;font-size:14px}
.proj b{color:#fff}
.line{height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:18px 0}
.tabs{display:flex;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;padding:12px;border-radius:10px;cursor:pointer;font-weight:bold;font-size:15px;background:transparent;color:#ccc}
.tabs button.active{background:linear-gradient(135deg,#f5d76e,#d4af37);color:#000;box-shadow:0 5px 15px rgba(212,175,55,.4)}
label{display:block;text-align:right;margin:12px 0 5px;color:#f5d76e;font-weight:bold;font-size:13px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.95);color:#000;font-size:15px}
input:focus{outline:2px solid #d4af37}
.btn{width:100%;padding:14px;margin-top:18px;border:0;border-radius:13px;background:linear-gradient(135deg,#fff2a8,#f5d76e,#d4af37);color:#000;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 10px 25px rgba(212,175,55,.35)}
.small{margin-top:12px;font-size:13px;color:#bbb}
.msg{display:none;margin-top:12px;padding:11px;border-radius:10px;font-size:14px;font-weight:bold}
.msg.ok{display:block;background:#1db954;color:#fff}
.msg.err{display:block;background:#ff4444;color:#fff}
.footer{margin-top:18px;font-size:12px;color:#999;text-align:center;line-height:1.7}
.gold{color:#f5d76e}
</style>
</head>
<body>
<div class="wrap">
<div class="top-badge">✦ NEW KAIRO PROJECT • SAFETY FIRST ✦</div>
<div class="card">
<div class="logo">NK</div>
<h1>NK- HSE Portal</h1>
<p class="proj"><b>New Kairo Project</b><br>بوابة السلامة والصحة المهنية</p>
<div class="line"></div>
<div class="tabs">
<button id="tabLogin" class="active" onclick="showLogin()">تسجيل الدخول</button>
<button id="tabSignup" onclick="showSignup()">اشتراك جديد</button>
</div>
<div id="loginBox">
<label>البريد الإلكتروني</label>
<input id="loginEmail" type="email" placeholder="example@email.com">
<label>كلمة السر</label>
<input id="loginPass" type="password" placeholder="••••••••">
<button class="btn" onclick="login()">دخول للبوابة →</button>
<p class="small">نسيت كلمة السر؟ تواصل مع إدارة السلامة</p>
</div>
<div id="signupBox" style="display:none">
<label>الاسم بالكامل</label><input id="suName" placeholder="مثال: أحمد محمد">
<label>البريد الإلكتروني</label><input id="suEmail" type="email" placeholder="example@email.com">
<label>رقم التليفون</label><input id="suPhone" placeholder="01xxxxxxxxx">
<label>المهنة</label><input id="suJob" placeholder="حداد / نجار / كهربائي">
<label>كلمة السر</label><input id="suPass" type="password" placeholder="اختر كلمة سر قوية">
<label>تأكيد كلمة السر</label><input id="suPass2" type="password" placeholder="اكتبها تاني">
<button class="btn" onclick="signup()">إنشاء حساب جديد</button>
</div>
<div id="msg" class="msg"></div>
</div>
<div class="footer">© 2026 <span class="gold">New Kairo Project</span> - NK HSE Portal<br>رواد الهندسة الحديثة • السلامة أولاً</div>
</div>
<script>
function showLogin(){document.getElementById('loginBox').style.display='block';document.getElementById('signupBox').style.display='none';document.getElementById('tabLogin').classList.add('active');document.getElementById('tabSignup').classList.remove('active');}
function showSignup(){document.getElementById('loginBox').style.display='none';document.getElementById('signupBox').style.display='block';document.getElementById('tabLogin').classList.remove('active');document.getElementById('tabSignup').classList.add('active');}
function showMsg(t,ok){let m=document.getElementById('msg');m.innerText=t;m.className='msg '+(ok?'ok':'err');}
function signup(){let n=document.getElementById('suName').value.trim();let e=document.getElementById('suEmail').value.trim();let ph=document.getElementById('suPhone').value.trim();let j=document.getElementById('suJob').value.trim();let p=document.getElementById('suPass').value;let p2=document.getElementById('suPass2').value;if(!n||!e||!ph||!p){showMsg('من فضلك املأ كل البيانات',false);return;}if(p!==p2){showMsg('كلمة السر مش متطابقة',false);return;}let users=JSON.parse(localStorage.getItem('nk_users')||'[]');if(users.find(u=>u.email===e)){showMsg('الإيميل ده متسجل قبل كده، سجل دخول',false);return;}users.push({name:n,email:e,phone:ph,job:j,pass:p});localStorage.setItem('nk_users',JSON.stringify(users));showMsg('تم إنشاء الحساب بنجاح! سجل دخول دلوقتي',true);showLogin();}
function login(){let e=document.getElementById('loginEmail').value.trim();let p=document.getElementById('loginPass').value;let users=JSON.parse(localStorage.getItem('nk_users')||'[]');let u=users.find(x=>x.email===e && x.pass===p);if(u){showMsg('أهلا بيك يا '+u.name+' - تم الدخول بنجاح! الخطوة الجاية: الصفحة الرئيسية',true);}else{showMsg('الإيميل أو كلمة السر غلط، لو لسه معندكش حساب دوس اشتراك جديد',false);}}
</script>
</body>
</html>
