<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملف العامل - RMED</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial}
body{margin:0;background:#F6F7F9;color:#111}
.hazard{height:10px;background:repeating-linear-gradient(45deg,#FFD700 0 18px,#111 18px 36px)}
.wrap{max-width:920px;margin:auto;padding:16px}
/* الكارنيه فوق - فيه الصورة + البيانات + QR أوتوماتيك */
.top{background:#0F2A4D;color:#fff;border-radius:16px;padding:18px;display:flex;gap:16px;align-items:center}
.top img{width:95px;height:115px;object-fit:cover;border-radius:12px;border:3px solid #C9A227;background:#fff;flex-shrink:0}
.top h1{margin:0;font-size:26px;color:#D4AF37;line-height:1.2}
.top p{margin:4px 0 0;color:#CBD5E1;font-size:13px}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:800}
.badge.green{background:#E8F5E9;color:#2E7D32}.badge.gold{background:#FFF8E1;color:#8a6d00}
.qr-card{background:#fff;padding:8px 8px 6px;border-radius:12px;text-align:center;flex-shrink:0}
.qr-card canvas,.qr-card img{width:120px!important;height:120px!important;display:block}
.qr-card b{display:block;color:#0A1F44;font-size:13px;margin-top:4px}
.qr-card small{display:block;color:#8a6d00;font-size:10px;font-weight:800}
.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:16px;margin-top:14px}
.card h2{margin:0 0 12px;font-size:17px;border-bottom:2px solid #FF6B00;padding-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:#F8F9FA;border:1px solid #eee;border-radius:10px;padding:10px}
.field b{display:block;font-size:11px;color:#888}
.field span{display:block;font-weight:800;margin-top:3px;word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:12px}
table th{background:#0F2A4D;color:#fff;padding:8px}
table td{padding:8px;border-bottom:1px solid #eee;text-align:center}
.empty{color:#888;text-align:center;padding:12px;font-size:13px}
.btn{width:100%;background:#FF6B00;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:900;cursor:pointer;margin-top:12px}
@media(max-width:650px){.top{flex-direction:column;text-align:center}.grid{grid-template-columns:1fr}.top h1{font-size:22px}}
</style>
</head>
<body>
<div class="hazard"></div>
<div class="wrap">
<div id="loading" style="text-align:center;padding:40px">⏳ جاري تجميع ملف العامل...</div>

<div id="fileBox" style="display:none">
  <!-- الكارنيه - QR بيتولد أوتوماتيك هنا -->
  <div class="top">
    <img id="f-photo" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <div style="flex:1">
      <h1 id="f-name">-</h1>
      <p id="f-job">-</p>
      <p><span class="badge gold" id="f-code">-</span> <span class="badge green" id="f-status">-</span> <span class="badge gold" id="f-company">-</span></p>
    </div>
    <div class="qr-card">
      <div id="qrBox"></div>
      <b id="qrCodeText">-</b>
      <small>SCAN FOR FULL FILE</small>
    </div>
  </div>

  <!-- كله ورا بعضه - مفيش تابات -->
  <div class="card"><h2>👤 بيانات العامل - Employee Data</h2><div class="grid" id="dataGrid"></div></div>
  <div class="card"><h2>📄 التصاريح - Permits <span id="c-permits"></span></h2><div id="permitsList"></div></div>
  <div class="card"><h2>⚠️ المخالفات - Violations <span id="c-violations"></span></h2><div id="violationsList"></div></div>
  <div class="card"><h2>🦺 مهمات المخزن - PPE / Store <span id="c-ppe"></span></h2><div id="ppeList"></div></div>
  <div class="card"><h2>🎓 التدريبات - Trainings <span id="c-train"></span></h2><div id="trainList"></div></div>

  <button class="btn" onclick="window.print()">🖨️ طباعة الملف</button>
  <p id="debug" style="font-size:11px;color:#888;text-align:center;margin-top:10px"></p>
</div>

<div id="notFound" style="display:none;text-align:center;padding:40px;background:#fff;border-radius:16px">
  <h2>❌ العامل مش موجود</h2><p id="notFoundText" style="color:#666"></p>
  <button class="btn" onclick="location.href='induction.html'">ارجع للـ Induction</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script>
function safe(v){let s=String(v??'').trim();return s?s:'-'}
function pick(o,keys){for(let k of keys){if(o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return ''}
function normDate(v){if(!v)return '';if(v.toDate){try{return v.toDate().toISOString().slice(0,10)}catch(e){}}return String(v).slice(0,10)}
function renderTable(list, cols){
  if(!list.length) return '<div class="empty">لا توجد بيانات - No Data</div>';
  let head = cols.map(c=>'<th>'+c.label+'</th>').join('');
  let rows = list.map(r=>'<tr>'+cols.map(c=>{let v=pick(r,c.keys);if(c.isDate)v=normDate(v);return '<td>'+safe(v)+'</td>'}).join('')+'</tr>').join('');
  return '<table><tr>'+head+'</tr>'+rows+'</table>';
}
async function tryQuery(colls, fieldNames, code){
  let db = firebase.firestore();
  for(let coll of colls){
    for(let field of fieldNames){
      try{
        let snap = await db.collection(coll).where(field,'==',code).limit(100).get();
        if(!snap.empty) return snap.docs.map(d=>({id:d.id,_coll:coll,...d.data()}));
      }catch(e){ console.log('skip',coll,field,e.message); }
    }
  }
  return [];
}
async function loadFile(){
  let params = new URLSearchParams(location.search);
  let code = params.get('id') || params.get('code') || '';
  code = decodeURIComponent(code||'').trim();
  if(!code){document.getElementById('loading').style.display='none';document.getElementById('notFound').style.display='block';document.getElementById('notFoundText').textContent='مفيش كود في اللينك';return;}
  try{
    let [workerArr, permits, violations, ppe, trainings] = await Promise.all([
      tryQuery(['workers','users','employees','employeeFile'], ['code','workerCode','employeeCode','nationalId'], code),
      tryQuery(['permits','permit'], ['workerCode','code','workerId','employeeCode'], code),
      tryQuery(['violations','employeeViolations','contractorViolations'], ['workerCode','code','workerId','employeeCode'], code),
      tryQuery(['storeTransactions','storeStock','store','ppe'], ['workerCode','code','workerId','employeeCode'], code),
      tryQuery(['train','training','trainings','induction'], ['workerCode','code','workerName','employeeCode'], code),
    ]);
    if(!workerArr.length){document.getElementById('loading').style.display='none';document.getElementById('notFound').style.display='block';document.getElementById('notFoundText').textContent='مفيش عامل بالكود: '+code;return;}
    let w = workerArr[0];
    let wCode = pick(w,['code','workerCode']) || code;
    document.getElementById('f-name').textContent = safe(pick(w,['name','fullName','employeeName']));
    document.getElementById('f-job').textContent = safe(pick(w,['job','profession'])) + ' • ' + safe(pick(w,['company','companyName']));
    document.getElementById('f-code').textContent = 'Code: ' + wCode;
    document.getElementById('f-status').textContent = safe(pick(w,['status'])) || 'Active';
    document.getElementById('f-company').textContent = safe(pick(w,['company','companyName']));
    let photo = pick(w,['photo','img','image','photoURL']);
    if(photo) document.getElementById('f-photo').src = photo;

    let fields = [
      ['الاسم الكامل','name','fullName','employeeName'],
      ['الكود','code','workerCode'],
      ['الرقم القومي','nationalId','nid','idNumber'],
      ['الوظيفة','job','profession'],
      ['الشركة','company','companyName'],
      ['تاريخ المباشرة','hire','hireDate','startDate','date'],
      ['التليفون','phone','phoneNumber'],
      ['رقم الطوارئ','emergency','emergencyNumber'],
      ['صلة القرابة','kin','relationship'],
      ['الحالة الصحية','health','healthStatus'],
      ['الحالة','status'],
      ['ملاحظات','notes','note'],
    ];
    document.getElementById('dataGrid').innerHTML = fields.map(f=>{
      let v = pick(w, f.slice(1)); if(f[0].includes('تاريخ')) v = normDate(v);
      return '<div class="field"><b>'+f[0]+'</b><span>'+safe(v)+'</span></div>';
    }).join('');

    document.getElementById('c-permits').textContent = '('+permits.length+')';
    document.getElementById('c-violations').textContent = '('+violations.length+')';
    document.getElementById('c-ppe').textContent = '('+ppe.length+')';
    document.getElementById('c-train').textContent = '('+trainings.length+')';

    document.getElementById('permitsList').innerHTML = renderTable(permits, [{label:'النوع',keys:['type','permitType','title']},{label:'التاريخ',keys:['date','createdAt'],isDate:true},{label:'الحالة',keys:['status']},{label:'ملاحظات',keys:['notes','note']}]);
    document.getElementById('violationsList').innerHTML = renderTable(violations, [{label:'النوع',keys:['type','violationType','title']},{label:'التاريخ',keys:['date','createdAt'],isDate:true},{label:'الوصف',keys:['description','notes']},{label:'الحالة',keys:['status']}]);
    document.getElementById('ppeList').innerHTML = renderTable(ppe, [{label:'المهمة',keys:['item','itemName','ppe','name']},{label:'الكمية',keys:['qty','quantity']},{label:'التاريخ',keys:['date','createdAt'],isDate:true},{label:'الحالة',keys:['status']}]);
    document.getElementById('trainList').innerHTML = renderTable(trainings, [{label:'الدورة',keys:['title','topic','course','trainingType','type']},{label:'التاريخ',keys:['date','createdAt'],isDate:true},{label:'الساعات',keys:['hours','hoursPer']},{label:'النتيجة',keys:['status','result']}]);

    // ===== الـ QR بيتولد أوتوماتيك هنا، مجرد ما الصفحة تفتح =====
    // مفيش حد بيعمله، هو بيتولد لوحده من الكود
    let shortLink = location.origin + location.pathname + '?id=' + encodeURIComponent(wCode);
    document.getElementById('qrCodeText').textContent = wCode;
    document.getElementById('qrBox').innerHTML = '';
    try{ new QRCode(document.getElementById('qrBox'), {text: shortLink, width:120, height:120, correctLevel: QRCode.CorrectLevel.M}); }catch(e){}

    document.getElementById('debug').textContent = 'ملف: ' + wCode + ' | تصاريح: ' + permits.length + ' | مخالفات: ' + violations.length + ' | مخزن: ' + ppe.length + ' | تدريبات: ' + trainings.length;
    document.getElementById('loading').style.display='none';
    document.getElementById('fileBox').style.display='block';
  }catch(e){ document.getElementById('loading').innerHTML = '❌ ' + e.message; }
}
loadFile();
</script>
</body>
</html>
