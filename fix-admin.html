<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fix Manager Account</title>
<style>body{font-family:'Segoe UI',Tahoma;text-align:center;padding:20px;background:#F4F6F9} .box{background:#fff;max-width:450px;margin:auto;padding:20px;border-radius:16px} button{background:#0F2A4D;color:#fff;border:none;padding:14px;border-radius:10px;width:100%;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px} input{width:100%;padding:12px;border:1.5px solid #CFD8DC;border-radius:10px;margin-top:8px;box-sizing:border-box}</style></head>
<body><div class="box">
<h2>🔧 Fix Manager Account</h2>
<p style="color:#78909C;font-size:14px;">This page will create the manager account on this device, and open Users page for you</p>
<p id="info" style="background:#FFF3E0;padding:10px;border-radius:10px;font-size:13px;text-align:left;"></p>
<label>Manager Email</label>
<input id="email" type="email" placeholder="Write manager email">
<label>Manager Password You Want</label>
<input id="pass" type="password" placeholder="Write password" autocomplete="new-password">
<label>Manager Name</label>
<input id="name" type="text" placeholder="Write manager name">
<button onclick="fix()">✅ Fix Manager Account & Login</button>
<button onclick="clearAll()" style="background:#D32F2F;">🗑️ Clear Everything & Start Fresh</button>
<p><a href="index.html">Go To Home</a></p>
</div>
<script>
function show(){
  let me=localStorage.getItem('currentUser');
  let db=JSON.parse(localStorage.getItem('safetyDB')||'{}');
  document.getElementById('info').innerHTML='Currently logged in:<br><b>'+(me||'No one')+'</b><br><br>Users count on this device: <b>'+((db.users||[]).length)+'</b><br>'+(db.users||[]).map(u=>u.email+' - '+u.role+' - '+u.status).join('<br>');
}
show();
function fix(){
  let email=document.getElementById('email').value.trim();
  let pass=document.getElementById('pass').value;
  let name=document.getElementById('name').value.trim()||'Manager';
  if(!email) return alert('Write manager email');
  if(!pass) return alert('Write password');
  let DB=JSON.parse(localStorage.getItem('safetyDB')||'{}'); if(!DB.users) DB.users=[];
  let idx=DB.users.findIndex(u=>u.email===email);
  let admin={name:name,job:'Safety Manager',email:email,pass:pass,photo:'',img:'',role:'manager',requestedRole:'manager',status:'approved',createdAt:new Date().toISOString()};
  if(idx>=0){ DB.users[idx]=admin; } else { DB.users.push(admin); }
  localStorage.setItem('safetyDB',JSON.stringify(DB));
  let session={email:email,name:admin.name,job:admin.job,role:'manager',photo:'',img:'',code:'ADMIN'};
  localStorage.setItem('currentUser',JSON.stringify(session));
  localStorage.setItem('safetyUser',JSON.stringify(session));
  localStorage.setItem('safetyUserName',admin.name);
  alert('✅ Fixed! Now you are Manager.');
  location.href='users.html';
}
function clearAll(){
  if(!confirm('Delete all data on this device?')) return;
  localStorage.clear();
  location.reload();
}
</script></body></html>
