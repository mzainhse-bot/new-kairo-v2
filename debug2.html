<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>فحص IndexedDB</title>
<style>body{font-family:Arial;padding:16px;background:#F4F6F9} .card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px} pre{background:#0A1F44;color:#7CFC00;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:400px;overflow:auto} button{background:#FFD54F;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer;margin:4px}</style>
</head>
<body>
<h2>🔍 فحص IndexedDB + Session + Firebase</h2>
<p>افتح الصفحة دي، استنى 5 ثواني، وصور النتيجة.</p>
<button onclick="location.reload()">🔄 تحديث</button>
<button onclick="copyOut()">📋 نسخ</button>
<div id="out"><p>جاري الفحص... استنى 5 ثواني</p></div>
<script>
var out = document.getElementById('out');
var logs = [];
function log(t){ logs.push(t); out.innerHTML = '<div class="card"><pre>'+logs.join('\n').replace(/</g,'&lt;')+'</pre></div>'; }
function copyOut(){ navigator.clipboard.writeText(logs.join('\n')).then(()=>alert('اتنسخ')); }

log('1) sessionStorage: ' + sessionStorage.length + ' مفتاح');
for(var i=0;i<sessionStorage.length;i++){ var k=sessionStorage.key(i); log(' - session: '+k+' = '+(sessionStorage.getItem(k)||'').slice(0,300)); }

log('\n2) هل فيه firebase؟ ' + (typeof firebase !== 'undefined' ? 'اه' : 'لا'));
log('هل فيه supabase؟ ' + (typeof supabase !== 'undefined' ? 'اه' : 'لا'));
log('localStorage keys: ' + Object.keys(localStorage).join(', '));

// فحص IndexedDB
if(!window.indexedDB){ log('\nالمتصفح مفيهوش IndexedDB'); }
else if(!indexedDB.databases){ log('\nمتصفحك قديم، مش بيقدر يعدد الداتابيز'); }
else{
  indexedDB.databases().then(function(dbs){
    log('\n3) IndexedDB Databases: ' + dbs.length);
    if(dbs.length===0) log('مفيش اي IndexedDB - يبقى الداتا جاية من سيرفر / Firebase');
    dbs.forEach(function(db){
      log(' - DB: ' + db.name + ' v' + db.version);
      try{
        var req = indexedDB.open(db.name);
        req.onsuccess = function(e){
          var d = e.target.result;
          log('   Stores في ' + db.name + ': ' + Array.from(d.objectStoreNames).join(', '));
          Array.from(d.objectStoreNames).forEach(function(storeName){
            try{
              var tx = d.transaction(storeName, 'readonly');
              var st = tx.objectStore(storeName);
              var countReq = st.count();
              countReq.onsuccess = function(){ log('     - ' + storeName + ' : ' + countReq.result + ' عنصر'); 
                // جيب عينة واحدة
                var getReq = st.getAll(null, 2);
                getReq.onsuccess = function(){ log('       عينة: ' + JSON.stringify(getReq.result).slice(0,800)); };
              };
            }catch(err){ log('     - ' + storeName + ' غلط: ' + err.message); }
          });
        };
        req.onerror = function(){ log('   مش قادر افتح ' + db.name); };
      }catch(err){ log('   غلط: ' + err.message); }
    });
  }).catch(function(e){ log('غلط في indexedDB.databases: ' + e.message); });
}

// فحص لو الصفحات التانية بتجيب من API
log('\n4) افتح صفحة الملاحظات وشوف هل الداتا بتظهر وانت قافل النت؟ لو بتظهر من غير نت يبقى في IndexedDB، لو اختفت يبقى من سيرفر.');
</script>
</body>
</html>
