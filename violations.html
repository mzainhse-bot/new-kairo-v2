<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contractor Violations - RMED</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial;}
body{margin:0;background:#0A1B33;color:#fff}
.sidebar{position:fixed;top:0;left:0;width:260px;height:100vh;background:#0A162E;color:#fff;padding:18px 14px;z-index:100;overflow-y:auto;transition:0.3s;border-right:1px solid rgba(201,162,39,.35)}
.sidebar.closed{left:-270px}
.sidebar .logo{text-align:center;border-bottom:1px solid rgba(201,162,39,.35);padding-bottom:14px;margin-bottom:14px}
.sidebar .logo b{font-size:22px;color:#FFD54F;display:block}
.sidebar .logo small{color:#B8C6D6}
.sidebar .user-box{background:#101F3D;border:1px solid rgba(201,162,39,.35);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:14px}
.sidebar .user-box img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #FFD54F}
.sidebar .user-box b{display:block;font-size:14px}
.sidebar .user-box small{color:#B8C6D6;font-size:12px}
.sidebar .menu-title{color:#FFD54F;font-size:12px;font-weight:bold;margin:16px 6px 6px;letter-spacing:1px}
.sidebar a{display:flex;align-items:center;gap:10px;color:#CFD8DC;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:bold;margin-bottom:3px}
.sidebar a:hover{background:#1A3A6A;color:#fff}
.sidebar a.active{background:linear-gradient(180deg,#FFE082,#D4AF37);color:#0A1F44}
.sidebar a .icon{font-size:18px;width:26px;text-align:center}
.sidebar .logout{margin-top:16px;background:#D32F2F !important;color:#fff !important;justify-content:center}
.main{margin-left:260px;transition:0.3s}
.main.full{margin-left:0}
.topbar{display:none}
@media(max-width:900px){
  .sidebar{left:-270px}
  .sidebar.open{left:0}
  .main{margin-left:0}
  .topbar{display:flex;justify-content:space-between;align-items:center;background:#0A162E;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:90;border-bottom:1px solid rgba(201,162,39,.35)}
  .topbar button{background:#FFD54F;border:none;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:18px;color:#0A1F44}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
  .overlay.show{display:block}
}
.page-head{background:linear-gradient(180deg,#0B1338,#0F2A4D);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:2px solid #C9A227;position:relative;overflow:hidden}
.page-head:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 0%,rgba(255,213,79,.12),transparent 40%);pointer-events:none}
.header-logo{display:flex;gap:12px;align-items:center;position:relative}
.header-shield{width:62px;height:68px;position:relative;flex-shrink:0}
.header-shield svg{width:100%;height:100%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.header-shield span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#FFD54F;font-size:12px;padding-bottom:6px}
.page-head h1{margin:0;font-size:28px;color:#fff} .page-head h1 span{color:#FFD54F} .page-head small{color:#FFD54F;font-weight:700}
.header-actions{display:flex;gap:12px;align-items:center;position:relative}
.header-actions .h-ic{width:38px;height:38px;border:1px solid rgba(255,213,79,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.05)}
.container{max-width:1150px;margin:auto;padding:0 16px 16px;}
.card{background:#101F3D;border:1px solid rgba(201,162,39,.55);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:700px){.grid{grid-template-columns:1fr;}}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px;color:#FFE082}
input,select,textarea{width:100%;padding:11px;border:1.5px solid rgba(201,162,39,.45);border-radius:10px;font-size:14px;outline:none;background:#0A162E;color:#fff}
input::placeholder,textarea::placeholder{color:#8A9AB0}
select option{background:#0A162E}
textarea{min-height:70px;resize:vertical;}
.btn{width:100%;background:linear-gradient(135deg,#FF5252,#B71C1C);color:#fff;border:none;padding:13px;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:14px;}
.btn2{background:#1A2F52;color:#fff;border:1px solid rgba(201,162,39,.45);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;}
.hero{background:radial-gradient(ellipse at 50% 0%,#1A3A6A,#0A1B33 65%);border:1px solid rgba(201,162,39,.55);border-radius:18px;padding:16px 18px 0;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#FFE082;font-weight:700}
.hero-visual{position:relative;height:170px;display:flex;align-items:center;justify-content:center;margin:8px 0 0}
.hero-main{width:150px;height:150px;position:relative;z-index:2;filter:drop-shadow(0 14px 16px rgba(0,0,0,.6));animation:float3d 3s ease-in-out infinite}
.hero-main img{width:100%;height:100%;object-fit:contain}
.hero-main span{font-size:90px;display:none}
.hero-small{position:absolute;right:22%;top:8px;width:110px;height:110px;z-index:3;filter:drop-shadow(0 10px 12px rgba(0,0,0,.6));transform:rotate(18deg);animation:float3d 3.4s ease-in-out infinite}
.hero-small img{width:100%;height:100%;object-fit:contain}
.hero-small span{font-size:70px;display:none}
.hero-title{position:absolute;left:18px;bottom:14px;z-index:4}
.hero-title b{font-size:22px;display:block;color:#fff}
.hero-title small{color:#FFE082;font-size:12px}
.hero-pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hero-pills span{background:rgba(255,255,255,.08);border:1px solid rgba(255,213,79,.35);padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#FFE082}
@keyframes float3d{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(1deg)}}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi{background:#fff;border-radius:16px;padding:14px 10px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.3);color:#0A1F44;position:relative;overflow:hidden}
.kpi b{font-size:20px;display:block;line-height:1.2} .kpi small{color:#555;font-size:11px;line-height:1.3;display:block}
.icon3d{width:62px;height:62px;margin:0 auto 6px;border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;transform:perspective(300px) rotateX(6deg) rotateY(-6deg);filter:drop-shadow(0 10px 12px rgba(0,0,0,.35));overflow:hidden}
.icon3d img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 5px 5px rgba(0,0,0,.3));position:relative;z-index:2}
.icon3d:after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%);pointer-events:none;z-index:3}
.icon3d.gold{background:radial-gradient(circle at 30% 25%,#FFF3B0,#FFD54F 35%,#B8860B 70%,#7A5A00);border:1px solid #FFE082}
.icon3d.green{background:radial-gradient(circle at 30% 25%,#A5D6A7,#2E7D32 45%,#1B5E20 75%);border:1px solid #A5D6A7}
.icon3d.orange{background:radial-gradient(circle at 30% 25%,#FFCC80,#FF9800 45%,#E65100 75%);border:1px solid #FFCC80}
.icon3d.red{background:radial-gradient(circle at 30% 25%,#EF9A9A,#D32F2F 45%,#8E0000 75%);border:1px solid #EF9A9A}
.icon3d.blue{background:radial-gradient(circle at 30% 25%,#90CAF9,#1565C0 45%,#0D47A1 75%);border:1px solid #90CAF9}
.icon3d.teal{background:radial-gradient(circle at 30% 25%,#80CBC4,#009688 45%,#004D40 75%);border:1px solid #80CBC4}
.icon3d .fallback{font-size:30px;position:relative;z-index:2;display:none}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
table th{background:#0A162E;color:#FFD54F;padding:9px;border-bottom:1px solid rgba(201,162,39,.4)} table td{padding:9px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center;vertical-align:middle;color:#fff}
.role-bar{background:#101F3D;border:1.5px solid #FFD54F;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.img-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.img-preview img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid rgba(255,213,79,.4);cursor:pointer;}
@media print{ .sidebar,.topbar,.overlay,.page-head,.role-bar{display:none!important;} .main{margin:0} body{background:#fff;} }
</style>
</head>
