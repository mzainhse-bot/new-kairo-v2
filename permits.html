<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permit Registration - RMED</title>
<style>
body{font-family:Arial;background:#f3f4f6;margin:0;padding:15px}
.header{background:#fff;padding:15px;border-radius:12px;text-align:center;box-shadow:0 2px 8px #0001}
.badge{background:#7c3aed;color:#fff;padding:6px 12px;border-radius:20px;font-weight:bold;display:inline-block}
.stats{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}
.card-stat{flex:1;background:#fff;padding:12px;border-radius:12px;text-align:center;min-width:120px}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.btn-delivered{background:#7c3aed;color:#fff;border:0;width:100%;padding:14px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-delivered.done{background:#16a34a}
.small{color:#666;font-size:13px}
</style>
</head>
<body>

<div class="header">
<div class="badge">V3 - NEW - 11 Nov 2026</div>
<h2>تسجيل التصاريح - RMED</h2>
<p><b>You are: Manager (manager) - You can close permits</b></p>
<p class="small">لو شايف V3 يبقى الكود الجديد وصل ✅ لو مش شايفه يبقى لسه الكاش القديم</p>
</div>

<div class="stats">
<div class="card-stat"><b id="total">0</b><br>إجمالي التصاريح</div>
<div class="card-stat"><b id="deliveredCount">0</b><br>تم التسليم</div>
<div class="card-stat"><b id="topCompany">-</b><br>أعلى شركة</div>
<div class="card-stat"><b id="lowCompany">-</b><br>أقل شركة</div>
</div>

<div id="list"></div>

<script>
let permits = JSON.parse(localStorage.getItem('permits_v3') || '[]');
if(permits.length===0){
  permits = [
    {id:1, company:'شركة النيل', site:'القاهرة', status:'pending'},
    {id:2, company:'شركة النيل', site:'الجيزة', status:'pending'},
    {id:3, company:'شركة الدلتا', site:'القاهرة', status:'pending'}
  ];
}
function render(){
  let list = document.getElementById('list');
  list.innerHTML = '';
  let delivered = permits.filter(p=>p.status==='delivered').length;
  document.getElementById('total').innerText = permits.length;
  document.getElementById('deliveredCount').innerText = delivered;

  // احصائيات الشركات
  let counts = {};
  permits.forEach(p=>{ if(p.status==='delivered'){ counts[p.company]=(counts[p.company]||0)+1 } });
  let keys = Object.keys(counts);
  if(keys.length){
    keys.sort((a,b)=>counts[b]-counts[a]);
    document.getElementById('topCompany').innerText = keys[0] + ' ('+counts[keys[0]]+')';
    document.getElementById('lowCompany').innerText = keys[keys.length-1] + ' ('+counts[keys[keys.length-1]]+')';
  }

  permits.forEach(p=>{
    let div = document.createElement('div');
    div.className='card';
    div.innerHTML = '<b>'+p.company+'</b> - '+p.site+'<br><span class="small">الحالة: '+(p.status==='delivered'?'تم التسليم ✅':'قيد الانتظار')+'</span><button class="btn-delivered '+(p.status==='delivered'?'done':'')+'" onclick="deliver('+p.id+',this)">'+(p.status==='delivered'?'تم التسليم ✅':'Delivered • تم التسليم')+'</button>';
    list.appendChild(div);
  });
  localStorage.setItem('permits_v3', JSON.stringify(permits));
}
function deliver(id, btn){
  permits = permits.map(p=> p.id===id ? {...p, status:'delivered'} : p);
  render();
}
render();
</script>
</body>
</html>
