<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول - RMED</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="rmed-theme.css">
<style>
body{background:var(--navy);min-height:100vh}
.lg{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.lg-side{background:linear-gradient(160deg,var(--navy-d),var(--navy) 60%,var(--navy-l));color:#fff;padding:48px 44px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;overflow:hidden}
.lg-side::after{content:"";position:absolute;left:-120px;bottom:-120px;width:360px;height:360px;border-radius:50%;border:60px solid rgba(166,38,57,.22)}
.lg-logo{width:100%;max-width:260px;background:#fff;border-radius:16px;padding:12px 20px;display:block}
.lg-side h2{margin:0;font-size:26px;font-weight:800;line-height:1.5}
.lg-side .tag{color:#9FB3CC;font-size:13px;margin-top:-12px}
.lg-slogan{min-height:78px;border-right:4px solid var(--crimson);padding:4px 14px}
.lg-slogan b{display:block;font-size:20px;font-weight:800;color:var(--gold-l);line-height:1.5;animation:sIn .5s}
.lg-slogan small{display:block;color:#CBD5E1;font-size:13px;margin-top:2px;direction:ltr;text-align:right;animation:sIn .5s}
@keyframes sIn{from{opacity:0;transform:translateY(8px)}}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.3);transition:.3s}.dots i.on{width:22px;background:var(--gold-l)}
.lg-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px}
.lg-stats div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;text-align:center}
.lg-stats b{display:block;font-size:20px;color:var(--gold-l)}.lg-stats small{color:#CBD5E1;font-size:12px}
.lg-main{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:28px 18px}
.lg-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 14px 40px rgba(15,30,50,.12)}
.lg-card h1{margin:0;font-size:24px;font-weight:800;color:var(--navy)}
.lg-card .sub{color:var(--tx2);font-size:13.5px;margin:4px 0 8px}
.fld{position:relative}
.fld>i{position:absolute;top:50%;right:12px;transform:translateY(-50%);font-size:18px;color:var(--tx3);pointer-events:none}
.fld .inp{padding-right:40px;height:46px}
.fld .eye{position:absolute;top:50%;left:8px;transform:translateY(-50%);border:0;background:none;color:var(--tx2);cursor:pointer;font-size:19px;padding:6px}
.lg-card .btn{width:100%;height:46px;margin-top:12px;font-size:15px}
.lg-card .btn-primary{margin-top:18px}
.lg-msg{min-height:22px;text-align:center;font-size:13.5px;font-weight:700;color:var(--bad);margin:12px 0 0}
.lg-msg.ok{color:var(--ok)}
.lg-links{text-align:center;font-size:13.5px;margin-top:14px;color:var(--tx2)}
.lg-links a{color:var(--crimson);font-weight:800;text-decoration:none}
.lg-foot{text-align:center;color:var(--tx3);font-size:12px;margin-top:16px}
@media(max-width:860px){.lg{grid-template-columns:1fr}.lg-side{padding:26px 22px;gap:14px}.lg-side h2{font-size:19px}.lg-stats,.lg-slogan~.dots{display:none}.lg-slogan{min-height:0}.lg-side::after{display:none}.lg-logo{max-width:200px}}
</style>
</head>
<body>
<div class="lg">
  <aside class="lg-side">
    <img class="lg-logo" id="logo" alt="RMED">
    <h2>نظام إدارة السلامة والصحة المهنية</h2>
    <div class="tag">Safety Today ... A Better Tomorrow</div>
    <div class="lg-slogan" id="slogan"></div>
    <div class="dots" id="sloganDots"></div>
    <div class="lg-stats"><div><b>100%</b><small>التزام</small></div><div><b>0</b><small>هدفنا صفر حوادث</small></div><div><b>24/7</b><small>سلامة</small></div></div>
  </aside>
  <main class="lg-main">
    <div class="lg-card">
      <h1>تسجيل الدخول</h1>
      <p class="sub">ادخل بحسابك للمتابعة إلى لوحة التحكم</p>
      <label class="lbl" for="l-email">البريد الإلكتروني</label>
      <div class="fld"><i class="ti ti-mail"></i><input id="l-email" class="inp ltr" type="email" placeholder="name@example.com" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('l-pass').focus()"></div>
      <label class="lbl" for="l-pass">كلمة المرور</label>
      <div class="fld"><i class="ti ti-lock"></i><input id="l-pass" class="inp ltr" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="eye" type="button" onclick="togglePass()" aria-label="إظهار كلمة المرور"><i class="ti ti-eye" id="eyeIc"></i></button></div>
      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()"><i class="ti ti-login-2"></i>دخول</button>
      <button class="btn btn-ghost" onclick="loginAsVisitor()"><i class="ti ti-eye"></i>دخول كزائر (عرض فقط)</button>
      <p class="lg-msg" id="msg" role="alert"></p>
      <div class="lg-links">مفيش عندك حساب؟ <a href="register.html">إنشاء حساب جديد</a><br><a href="index.html" style="color:var(--tx2);font-weight:600">العودة للرئيسية</a></div>
      <div class="lg-foot">Safety Is Not An Option, It's A Value</div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="rmed-shell.js"></script>
<script>
document.getElementById('logo').src=RMED.LOGO;

/* ===== شعارات السلامة المتحركة ===== */
const SLOGANS=[
 {ar:'السلامة أولاً',en:'Safety First'},
 {ar:'ارجع بيتك سالم لأهلك',en:'Your Family Is Waiting For You - Go Home Safe'},
 {ar:'فكر قبل ما تشتغل',en:'Think Before You Work'},
 {ar:'خوذتك = حياتك',en:'Your Helmet = Your Life'},
 {ar:'مفيش شغل من غير تصريح',en:'No Work Without A Permit'},
 {ar:'شايف خطر؟ بلّغ فوراً',en:'See A Hazard? Report It Now'},
 {ar:'السلامة مش اختيار، دي قيمة',en:"Safety Is Not An Option, It's A Value"},
 {ar:'البس مهماتك كاملة',en:'Wear Your Full PPE'}
];
let sIdx=0;
function showSlogan(){
  const s=SLOGANS[sIdx];
  document.getElementById('slogan').innerHTML='<b>'+s.ar+'</b><small>'+s.en+'</small>';
  document.getElementById('sloganDots').innerHTML=SLOGANS.map((_,i)=>'<i class="'+(i===sIdx?'on':'')+'"></i>').join('');
  sIdx=(sIdx+1)%SLOGANS.length;
}
showSlogan();setInterval(showSlogan,4000);

function togglePass(){const p=document.getElementById('l-pass');const show=p.type==='password';p.type=show?'text':'password';document.getElementById('eyeIc').className='ti ti-eye'+(show?'-off':'')}
function pick(o,keys){ for(let k of keys){ if(o[k]!==undefined && o[k]!==null && o[k]!=='') return o[k]; } return ''; }
function getDB(){
  if(window.db) return window.db;
  if(window.firebase && firebase.firestore) return firebase.firestore();
  return null;
}
/* لو جاي من صفحة تانية (مثلاً ملف موظف من QR) بيرجعله بعد الدخول - لازم يكون ملف html محلي بس */
function nextUrl(){
  const n=new URLSearchParams(location.search).get('next')||'';
  return /^[\w\-.\/]+\.html(\?[\w=%&\-.]*)?$/.test(n)&&!n.startsWith('/')&&!n.includes('..')?n:'dashboard.html';
}
/* مفيش redirect أوتوماتيك (عشان متحصلش loop) - بنعرض آخر إيميل بس */
(function(){
  if(location.search.includes('logout')) return;
  try{
    const u=JSON.parse(localStorage.getItem('safetyUser')||localStorage.getItem('currentUser')||'{}');
    if(u && u.email && u.email!=='visitor@rmed.com') document.getElementById('l-email').value=u.email;
  }catch(e){}
})();

/* البحث عن المستخدم: استعلامات مباشرة بالإيميل (بالحروف زي ما اتكتب وصغيرة) في users ثم employees ثم workers.
   ده سريع ومبينزلش كل الحسابات. */
async function findUser(db,email,rawEmail){
  const variants=[...new Set([email,rawEmail.trim()])];
  const fields=['email','Email','userEmail'];
  const colls=['users','employees','workers'];
  const jobs=[];
  colls.forEach(c=>fields.forEach(f=>jobs.push((async()=>{
    try{ const s=await db.collection(c).where(f,'in',variants).limit(1).get(); if(!s.empty){ const d=s.docs[0]; return {...d.data(),id:d.id,_coll:c}; } }catch(e){}
    return null;
  })())));
  const res=await Promise.all(jobs);
  return res.find(Boolean)||null;
}
/* ⚠ للحسابات القديمة اللي إيميلها متخزن بشكل مختلف (مسافات / حروف كابيتال مختلفة): بيجيب كل المستخدمين ويقارن.
   ده بيحمّل كل الحسابات (بما فيها كلمات المرور) على جهاز اللي بيسجل دخول - مش آمن. بعد ما توحد الإيميلات في الداتا، غيّره لـ false. */
const LEGACY_FULL_SCAN=true;
async function legacyScan(db,email){
  for(const coll of ['users','employees','workers']){
    try{
      const snap=await db.collection(coll).get();
      for(const d of snap.docs){
        const data=d.data();
        const em=String(pick(data,['email','Email','EMAIL','userEmail'])||'').trim().toLowerCase();
        if(em===email) return {...data,id:d.id,_coll:coll};
      }
    }catch(e){}
  }
  return null;
}

async function doLogin(){
 const email=document.getElementById('l-email').value.trim().toLowerCase();
 const rawEmail=document.getElementById('l-email').value;
 const pass=document.getElementById('l-pass').value;
 const msg=document.getElementById('msg'),btn=document.getElementById('loginBtn');
 msg.className='lg-msg';msg.textContent='';
 if(!email) return msg.textContent='اكتب الإيميل';
 if(!pass) return msg.textContent='اكتب كلمة المرور';
 const db=getDB();
 if(!db) return msg.textContent='Firebase غير متصل - راجع ملف firebase-config.js';
 msg.textContent='جاري التحقق...';btn.disabled=true;
 try{
  let user=await findUser(db,email,rawEmail);
  if(!user && LEGACY_FULL_SCAN) user=await legacyScan(db,email);
  if(!user){msg.textContent='الإيميل ده مش مسجل، اعمل حساب جديد';btn.disabled=false;return}
  const saved=pick(user,['pass','password','pwd','passWord','userPass']);
  if(String(saved)!==String(pass)){msg.textContent='كلمة المرور غلط';btn.disabled=false;return}
  const statusMap={'معلق':'pending','مرفوض':'rejected','محظور':'blocked','مقبول':'approved','موافق عليه':'approved','pending':'pending','rejected':'rejected','blocked':'blocked','approved':'approved','active':'approved','نشط':'approved'};
  const rawStatus=String(pick(user,['status','state'])||'approved').trim();
  const status=statusMap[rawStatus]||statusMap[rawStatus.toLowerCase()]||'approved';
  if(status==='pending'){msg.textContent='حسابك لسه مستني موافقة المدير';btn.disabled=false;return}
  if(status==='rejected'||status==='blocked'){msg.textContent='حسابك مرفوض من المدير';btn.disabled=false;return}
  const roleMap={'مدير':'manager','مشرف':'supervisor','موظف':'employee','زائر':'visitor','manager':'manager','admin':'manager','supervisor':'supervisor','employee':'employee','visitor':'visitor'};
  const rawRole=String(pick(user,['role','jobTitle','position'])||'employee').trim();
  let norm=roleMap[rawRole]||roleMap[rawRole.toLowerCase()]||rawRole.toLowerCase()||'employee';
  if(norm==='admin') norm='manager';
  const jobVal=String(pick(user,['job','profession'])||'');
  const session={
    id:user.id,email:email,
    name:pick(user,['name','fullName','employeeName'])||email,
    job:jobVal||norm||'',
    role:norm||'employee',
    photo:pick(user,['photo','img','image','avatar','photoURL'])||'',
    img:pick(user,['photo','img','image'])||'',
    code:pick(user,['code','employeeCode','empCode'])||user.id||'',
    company:pick(user,['company','companyName'])||''
  };
  localStorage.setItem('safetyUser',JSON.stringify(session));
  localStorage.setItem('currentUser',JSON.stringify(session));
  localStorage.setItem('safetyUserName',session.name);
  localStorage.setItem('rmed_last_login', new Date().toISOString());
  msg.className='lg-msg ok';msg.textContent='أهلاً بيك يا '+session.name+' ... جاري التحويل';
  setTimeout(()=>location.href=nextUrl(),500);
 }catch(err){msg.textContent='مشكلة في الاتصال: '+err.message;btn.disabled=false}
}
function loginAsVisitor(){const s={email:'visitor@rmed.com',name:'زائر',job:'Visitor',role:'visitor',photo:'',img:''};localStorage.setItem('safetyUser',JSON.stringify(s));localStorage.setItem('currentUser',JSON.stringify(s));location.href=nextUrl()}
</script>
</body>
</html>
