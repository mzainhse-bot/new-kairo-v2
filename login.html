<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - RMED</title>
<style>*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial}body{margin:0;background:#0A1F44;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}.box{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:24px}label{display:block;font-weight:bold;font-size:13px;margin:10px 0 5px}input{width:100%;padding:12px;border:1.5px solid #CFD8DC;border-radius:10px}button{width:100%;background:#2E7D32;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:16px}</style>
</head>
<body><div class="box">
<h2 style="text-align:center;margin:0;">RMED • تسجيل الدخول</h2><p style="text-align:center;color:#78909C;font-size:13px;">ادخل بالإيميل والباسورد</p>
<label>📧 الإيميل</label><input id="l-email" type="email" placeholder="example@gmail.com">
<label>🔒 الباسورد</label><input id="l-pass" type="password" placeholder="الباسورد">
<button onclick="doLogin()">🚀 دخول</button>
<p style="text-align:center;font-size:13px;">معندكش حساب؟ <a href="register.html">سجل حساب جديد</a></p>
<p id="msg" style="text-align:center;color:#D32F2F;font-size:13px;"></p>
</div>
<script>
function doLogin(){
  let email=document.getElementById('l-email').value.trim().toLowerCase(), pass=document.getElementById('l-pass').value;
  let DB=JSON.parse(localStorage.getItem('safetyDB')||'{}'); let user=(DB.users||[]).find(u=>u.email===email);
  if(!user) return document.getElementById('msg').innerText='الإيميل ده مش مسجل، سجل حساب جديد الأول';
  if(user.pass!==pass) return document.getElementById('msg').innerText='الباسورد غلط';
  if(user.status==='pending') return document.getElementById('msg').innerText='⏳ حسابك لسه في انتظار موافقة المدير، استنى شوية';
  if(user.status==='rejected') return document.getElementById('msg').innerText='❌ حسابك اترفض من المدير';
  localStorage.setItem('safetyUser',JSON.stringify({email:user.email,name:user.name,job:user.job,role:user.role,photo:user.photo}));
  location.href='dashboard.html';
}
</script></body></html>
